version: '3.8'

services:
  # OTEL-LGTM 스택 (Logs, Grafana, Tempo, Mimir)
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: multiagent-otel-lgtm
    ports:
      # OpenTelemetry Collector OTLP receivers
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver
      # Grafana UI
      - "3000:3000"     # Grafana web UI
      # Additional receivers
      - "8888:8888"     # Prometheus metrics (exposed by the collector)
      - "8889:8889"     # Prometheus remote write
      - "9090:9090"     # Prometheus server
      - "9411:9411"     # Zipkin receiver
    environment:
      # Grafana admin credentials
      GF_SECURITY_ADMIN_PASSWORD: admin
      # OTEL Collector configuration
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
      # Enable debug logging (optional)
      GRAFANA_LOG_LEVEL: debug
    volumes:
      # OTEL Collector configuration (will be created)
      - ./otel/otel-collector-config.yaml:/otel-lgtm/otelcol-config.yaml
      # Grafana provisioning - 자동 데이터소스 및 대시보드 설정
      - ./otel/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./otel/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./otel/multiagent-dashboard.json:/var/lib/grafana/dashboards/multiagent-dashboard.json
      # Grafana data persistence
      - otel-grafana-data:/var/lib/grafana
      # Tempo data persistence
      - tempo-data:/var/lib/tempo
      # Mimir data persistence
      - mimir-data:/var/lib/mimir
      # Loki data persistence
      - loki-data:/var/lib/loki
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # OpenTelemetry Auto-instrumentation (선택사항 - 애플리케이션용)
  jaeger-all-in-one:
    image: jaegertracing/all-in-one:latest
    container_name: multiagent-jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "14268:14268"   # Jaeger HTTP receiver
      - "14250:14250"   # Jaeger gRPC receiver  
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
    restart: unless-stopped
    profiles:
      - jaeger  # 옵셔널 서비스 (docker-compose --profile jaeger up)

volumes:
  otel-grafana-data:
    driver: local
  tempo-data:
    driver: local  
  mimir-data:
    driver: local
  loki-data:
    driver: local

networks:
  default:
    name: multiagent-otel-network