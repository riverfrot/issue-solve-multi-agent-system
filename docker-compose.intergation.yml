version: '3.8'

services:
  # =====================================
  # KAFKA 스택
  # =====================================
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    hostname: kafka
    container_name: multiagent-kafka
    ports:
      - "9092:9092"
      - "9093:9093"
      - "9101:9101"
    environment:
      # KRaft 모드 설정
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      
      # 리스너 설정
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      
      # 클러스터 ID
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      
      # 복제 설정
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      
      # JMX 모니터링 (OTEL이 수집할 수 있도록)
      KAFKA_JMX_PORT: 9101
      KAFKA_JMX_HOSTNAME: kafka
      
      # 토픽 자동 생성 허용
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      
      # 로그 보존 정책
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      
      # KRaft 로그 디렉토리
      KAFKA_LOG_DIRS: '/var/lib/kafka/data'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - multiagent-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: multiagent-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8089:8089"
    environment:
      KAFKA_CLUSTERS_0_NAME: multiagent
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - multiagent-network

  kafka-init:
    image: confluentinc/cp-kafka:7.4.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ '/bin/sh', '-c' ]
    command: |
      "
      echo 'Waiting for Kafka to be ready...'
      sleep 5
      
      echo 'Creating topics...'
      
      # 챗봇 요청 토픽
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic chat-request \
        --replication-factor 1 \
        --partitions 3 \
        --config retention.ms=86400000
      
      # 챗봇 응답 토픽  
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic chat-response \
        --replication-factor 1 \
        --partitions 3 \
        --config retention.ms=86400000
      
      # 시스템 모니터링 토픽
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic system-events \
        --replication-factor 1 \
        --partitions 1 \
        --config retention.ms=86400000
      
      # OTEL 메트릭 토픽 (추가)
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists \
        --topic otel-metrics \
        --replication-factor 1 \
        --partitions 1 \
        --config retention.ms=604800000
      
      echo 'Topics created successfully!'
      kafka-topics --bootstrap-server kafka:29092 --list
      "
    networks:
      - multiagent-network

  # =====================================
  # OBSERVABILITY 스택 (OTEL-LGTM)
  # =====================================
  otel-lgtm:
    image: grafana/otel-lgtm:latest
    container_name: multiagent-otel-lgtm
    ports:
      # OpenTelemetry Collector OTLP receivers
      - "4317:4317"     # OTLP gRPC receiver
      - "4318:4318"     # OTLP HTTP receiver
      # Grafana UI
      - "3000:3000"     # Grafana web UI
      # Additional receivers
      - "8888:8888"     # Prometheus metrics (exposed by the collector)
      - "8889:8889"     # Prometheus remote write
      - "9090:9090"     # Prometheus server
      - "9411:9411"     # Zipkin receiver
    environment:
      # Grafana admin credentials
      GF_SECURITY_ADMIN_PASSWORD: admin
      # OTEL Collector configuration
      OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4317
      # Enable debug logging (optional)
      GRAFANA_LOG_LEVEL: debug
    volumes:
      # OTEL Collector configuration (will be created)
      - ./otel/otel-collector-config.yaml:/otel-lgtm/otelcol-config.yaml
      # Grafana provisioning - 자동 데이터소스 및 대시보드 설정
      - ./otel/grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - ./otel/grafana-dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./otel/multiagent-dashboard.json:/var/lib/grafana/dashboards/multiagent-dashboard.json
      # Grafana data persistence
      - otel-grafana-data:/var/lib/grafana
      # Tempo data persistence
      - tempo-data:/var/lib/tempo
      # Mimir data persistence
      - mimir-data:/var/lib/mimir
      # Loki data persistence
      - loki-data:/var/lib/loki
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - multiagent-network

  # OpenTelemetry Auto-instrumentation (선택사항 - 애플리케이션용)
  jaeger-all-in-one:
    image: jaegertracing/all-in-one:latest
    container_name: multiagent-jaeger
    ports:
      - "16686:16686"   # Jaeger UI
      - "14268:14268"   # Jaeger HTTP receiver
      - "14250:14250"   # Jaeger gRPC receiver  
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
    restart: unless-stopped
    networks:
      - multiagent-network
    profiles:
      - jaeger  # 옵셔널 서비스 (docker-compose --profile jaeger up)

volumes:
  kafka-data:
    driver: local
  otel-grafana-data:
    driver: local
  tempo-data:
    driver: local  
  mimir-data:
    driver: local
  loki-data:
    driver: local

networks:
  multiagent-network:
    name: multiagent-network
    driver: bridge